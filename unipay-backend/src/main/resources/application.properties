# ==============================================================================
# UNIPAY - Unified Payment Gateway Configuration
# Academic DBMS Project - Spring Boot 3 & MySQL
# ==============================================================================

spring.application.name=unipay-backend
server.port=8080

# ------------------------------------------------------------------------------
# MySQL Database Connection (Compatible with Windows MySQL service MySQL267)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/unipay?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root

# >>> REPLACE YOUR_MYSQL_PASSWORD BELOW WITH YOUR ACTUAL MYSQL ROOT PASSWORD <<<
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# Hibernate & JPA Settings
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable SQL script initialization if needed
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
